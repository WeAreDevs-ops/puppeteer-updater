<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Roblox Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background-color: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        .input-group input:focus { outline: none; border-color: #3498db; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; background-color: #3498db; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #captcha-container { margin-top: 15px; display: flex; justify-content: center; min-height: 0; }
        #log-container { margin-top: 20px; background-color: #000; padding: 10px; border-radius: 5px; border: 1px solid #333; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow-y: auto; display: none; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .warning { color: #f39c12; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>API Login Proxy</h2>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Roblox Username" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Roblox Password">
        </div>

        <button id="login-btn">Secure Login</button>

        <div id="captcha-container"></div>

        <div id="log-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
